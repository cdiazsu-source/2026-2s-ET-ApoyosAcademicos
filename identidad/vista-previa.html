<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logotipo Unidad de Informática — vista previa</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; padding: 32px 20px 60px; background: #f2f2f7; font-family: system-ui, sans-serif; color: #222; }
  h1 { font-size: 1.2rem; margin: 0 0 20px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width: 1100px; }
  .caja { display: grid; place-items: center; min-height: 190px; padding: 24px; border-radius: 22px; }
  .caja img { width: min(100%, 420px); height: auto; }
  .blanca { background: #fff; }
  .azul { background: #00005c; }
  .amarilla { background: #f5ec00; }
  .pestana { background: #00005c; padding-top: 0; align-items: start; }
  .pestana div { background: #fff; padding: 14px 34px 18px; border-radius: 0 0 38px 38px; }
  .pestana img { width: 300px; }
  small { display: block; margin-top: 8px; color: #666; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Logotipo «UiFCE · Unidad de Informática» — Ancizar Sans</h1>
<div class="grid">
  <div><div class="caja blanca"><img src="logotipo-unidad-informatica.svg" alt="Logotipo sobre blanco"></div><small>Sobre blanco (azul)</small></div>
  <div><div class="caja azul"><img src="logotipo-unidad-informatica-blanco.svg" alt="Logotipo blanco sobre azul"></div><small>Sobre azul noche (blanco)</small></div>
  <div><div class="caja amarilla"><img src="logotipo-unidad-informatica.svg" alt="Logotipo sobre amarillo"></div><small>Sobre amarillo (azul)</small></div>
  <div><div class="caja pestana"><div><img src="logotipo-unidad-informatica.svg" alt="Logotipo en pestaña blanca"></div></div><small>En pestaña blanca, como el título del sitio</small></div>
</div>
</body>
</html>
